<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Land Page | Quang Tho Hoang</title>
  </head>
  <body>
    <header class="hero">
      <img src="./assets/logo.svg" class="logo" alt="">
      <div class="hero-container">
        <div class="left">
          <img src="./assets/desktop/image-hero-left.png" alt="">
        </div>
        <div class="middle">
          <h1 class="heading">Group Chat <br> for <span class="gradient-heading">Everyone</span></h1>
          <p>Meet makes it easy to connect with others strong face-to-face virtually and collaborate across any device</p>
          <div class="buttons">
            <button class="button download">Download <span>v1.3</span></button>
            <button class="button what">What is it?</button>
          </div>
        </div>
        <div class="right">
          <img src="./assets/desktop/image-hero-right.png" alt="">
        </div>
      </div>
    </header>
    <section class="divider">
      <span class="bar"></span>
      <span class="number">01</span>
    </section>
    <main>
      <section class="gallery flex">
        <div class="gallery-container flex">
          <img src="./assets/desktop/image-woman-in-videocall.jpg" alt="">
          <img src="./assets/desktop/image-women-videochatting.jpg" alt="">
          <img src="./assets/desktop/image-man-texting.jpg" alt="">
          <img src="./assets/desktop/image-men-in-meeting.jpg" alt="">
        </div>
      </section>
    </main>
  </body>
</html>
